# SearXNG 配置（本地开发）
# 关键项：启用 json 格式输出、关闭限流、设置 secret_key
use_default_settings: true

general:
  instance_name: "linkseek Search"
  debug: false

search:
  safe_search: 0
  autocomplete: ""
  # auto: SearXNG 按 Accept-Language / query 自动判断，避免英文 query 被强制带偏到中文结果
  default_lang: "auto"
  formats:
    - html
    - json

server:
  secret_key: "dev-secret-change-in-production-please-use-openssl-rand-hex-32"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

outgoing:
  # 代理地址在容器启动时由 entrypoint 脚本从 SEARXNG_PROXY 环境变量注入。
  # 本地开发：docker-compose.yml 设 SEARXNG_PROXY=http://host.docker.internal:7897
  # 生产部署：docker-compose.prod.yml 设 SEARXNG_PROXY=http://172.17.0.1:7890
  # 占位符 __SEARXNG_PROXY__ 在 searxng/docker-entrypoint.sh 中被 sed 替换。
  proxies:
    all://: __SEARXNG_PROXY__

# 按需启用的引擎（use_default_settings 合并语义下仅覆盖列出的项，其余引擎配置不动）。
# bilibili：B 站视频搜索（2026-11-06 接入，详见 docs/B站搜索接入-开发计划.md），
# 默认镜像已内置该引擎与 time_range 过滤，此处仅启用；归属 videos 分类。
engines:
  - name: bilibili
    disabled: false
