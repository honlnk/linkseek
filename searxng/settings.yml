# SearXNG 配置（本地开发）
# 关键项：启用 json 格式输出、关闭限流、设置 secret_key
use_default_settings: true

general:
  instance_name: "linkseek Search"
  debug: false

search:
  safe_search: 0
  autocomplete: ""
  # auto: SearXNG 按 Accept-Language / query 自动判断，避免英文 query 被强制带偏到中文结果
  default_lang: "auto"
  formats:
    - html
    - json

server:
  secret_key: "dev-secret-change-in-production-please-use-openssl-rand-hex-32"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

outgoing:
  # 通过宿主机代理访问 Google/DuckDuckGo 等境外搜索引擎。
  # 本地开发：host.docker.internal + Clash Verge 的 mixed-port（需 allow-lan: true）
  # 生产部署：改回 http://172.17.0.1:7890（Linux docker0 IP + mihomo 端口）
  proxies:
    all://: http://host.docker.internal:7897
