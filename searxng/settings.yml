# SearXNG 配置（本地开发）
# 关键项：启用 json 格式输出、关闭限流、设置 secret_key
use_default_settings: true

general:
  instance_name: "linkseek Search"
  debug: false

search:
  safe_search: 0
  autocomplete: ""
  # auto: SearXNG 按 Accept-Language / query 自动判断，避免英文 query 被强制带偏到中文结果
  default_lang: "auto"
  formats:
    - html
    - json

server:
  secret_key: "dev-secret-change-in-production-please-use-openssl-rand-hex-32"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

outgoing:
  # 代理地址不在此硬编码，改为依赖容器的 HTTP_PROXY/HTTPS_PROXY 环境变量。
  # SearXNG 底层用 httpx，默认 trust_env=True 会自动读取这些环境变量。
  # 本地开发：docker-compose.yml 设 HTTP_PROXY=http://host.docker.internal:7897（Clash Verge）
  # 生产部署：docker-compose.prod.yml 设 HTTP_PROXY=http://172.17.0.1:7890（mihomo）
  # 这样同一份 settings.yml 在两个环境都能正确走代理，无需为环境分叉配置文件。
  useragent_suffix: ""
